name: Build standalone HTML

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and verify
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdf-compare-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
          if-no-files-found: error
          retention-days: 14
